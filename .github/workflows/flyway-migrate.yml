name: Flyway Migrate

on:
  push:
    branches: [main]
    paths:
      - "sql/**"
      - ".github/workflows/flyway-migrate.yml"
      - ".github/workflows/flyway-run.yml"
  workflow_dispatch: {}

# One migration run at a time, and never cancel one in flight: a cancelled
# migration leaves the schema history in a state a human has to resolve.
concurrency:
  group: flyway-migrate
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/flyway-run.yml
    with:
      environment: dev
    secrets: inherit

  test:
    # test only runs if dev succeeded. The promotion order is the contract.
    needs: dev
    uses: ./.github/workflows/flyway-run.yml
    with:
      environment: test
    secrets: inherit

  production:
    needs: test
    uses: ./.github/workflows/flyway-run.yml
    with:
      environment: production
    secrets: inherit
